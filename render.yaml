# Render Blueprint for the ClauseGuard FastAPI backend.
# Deploy: push this repo to GitHub, then in Render "New +" -> "Blueprint" and
# pick this file. Set the secret env vars (GROQ_API_KEY, JWT_SECRET,
# ALLOWED_ORIGINS) in the dashboard when prompted.
services:
  - type: web
    name: clauseguard-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PRIMARY_MODEL
        value: openai/gpt-oss-120b
      - key: FAST_MODEL
        value: openai/gpt-oss-20b
      - key: CHAT_MIN_SIMILARITY
        value: "0.25"
      - key: AUTO_RECONCILE_VECTOR_STORE
        value: "true"
      - key: CHROMA_DIR
        value: /app/data/persist/chroma_db
      - key: DATABASE_URL
        value: sqlite:////app/data/persist/clauseguard.sqlite3
      # Phase 7: production posture. The API refuses to start without a real
      # JWT secret, explicit browser origins and authentication switched on.
      - key: APP_ENV
        value: production
      - key: REQUIRE_AUTH
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional: use PostgreSQL instead of the ephemeral SQLite file.
      # - key: DATABASE_URL
      #   sync: false
    disk:
      name: clauseguard-data
      mountPath: /app/data/persist
      sizeGB: 1
    # After the first deploy, open the Render Shell once and run:
    #   python scripts/seed_demo.py
    # so the hosted app has demo contracts in both the guest and demo scopes.
